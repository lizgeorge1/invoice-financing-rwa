[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.31"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Skeleton phase only: empty function bodies trigger "unused parameter",
# "can be restricted to pure" and "unreachable code" warnings. Delete this
# line once you have implemented the contracts.
ignored_error_codes = [5667, 2018, 5740]

[lint]
lint_on_build = false
